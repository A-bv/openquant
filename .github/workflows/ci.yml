name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Site contracts and browser parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pinned test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run parity and static-site contracts
        run: python -m pytest -q tests/

  engine:
    name: Engine, API, and React labs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install the engine and development tools
        run: pip install -e "./engine[api,dev]"

      - name: Lint the engine
        working-directory: engine
        run: ruff check .

      - name: Type-check the engine
        working-directory: engine
        run: mypy

      - name: Run the offline engine suite
        working-directory: engine
        run: python -m pytest -q -m "not live"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: engine/app/package-lock.json

      - name: Install React dependencies
        working-directory: engine/app
        run: npm ci

      - name: Lint the React labs
        working-directory: engine/app
        run: npm run lint

      - name: Build the React labs
        working-directory: engine/app
        env:
          VITE_API_URL: https://a-bv-openquant-api.hf.space
        run: npm run build -- --base=/openquant/labs/
