name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  parity:
    name: Browser math == engine math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the engine package and pytest
        # Pinned to a commit (the engine repo has no tags yet) so the parity
        # check is reproducible and an upstream change can't break CI silently.
        run: pip install pytest "openquant-engine @ git+https://github.com/A-bv/openquant-engine@7ab97a8bf6ca3c327bc80743e032f894b6d81522"

      - name: Run the parity suite (site/finance.js vs the engine)
        run: python -m pytest -q tests/
