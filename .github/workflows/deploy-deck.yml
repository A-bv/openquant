name: Deploy OpenQuant to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "engine/app/**"
      - ".github/workflows/deploy-deck.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: engine/app/package-lock.json

      - name: Build the live-ticker labs
        working-directory: engine/app
        env:
          VITE_API_URL: https://a-bv-openquant-api.hf.space
        run: |
          npm ci
          npm run build -- --base=/openquant/labs/

      - name: Assemble the course and labs
        run: |
          mkdir -p out/labs
          cp site/*.html site/*.js site/*.svg out/
          cp -r site/fonts out/fonts
          cp site/companion.html out/index.html
          cp -r engine/app/dist/. out/labs/

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"
